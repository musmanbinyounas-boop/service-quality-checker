name: ci-cd

on:
  push:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Lint
        run: ruff check src tests app scripts

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Test
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Pull model from HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p models
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Download attempt $attempt..."
            if curl -fsSL \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              "https://huggingface.co/spaces/musmanbinyounas/service-quality-checker/resolve/main/models/model.joblib" \
              -o models/model.joblib; then
              echo "Success – $(stat -c%s models/model.joblib) bytes"
              break
            fi
            [ "$attempt" -eq 8 ] && { echo "All attempts exhausted"; exit 1; }
            echo "Failed, sleeping 60 s before retry..."
            sleep 60
          done

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/service-quality-checker:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/service-quality-checker:latest

  deploy-to-space:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Update Space Dockerfile to pull prebuilt image
        env:
          GITHUB_SHA: ${{ github.sha }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import io, os, time
          from huggingface_hub import HfApi
          tag = os.environ['GITHUB_SHA']
          user = os.environ['DH_USER']
          dockerfile = f'FROM docker.io/{user}/service-quality-checker:{tag}\n'.encode()
          api = HfApi()
          for attempt in range(8):
              try:
                  api.upload_file(
                      path_or_fileobj=io.BytesIO(dockerfile),
                      path_in_repo='Dockerfile',
                      repo_id='musmanbinyounas/service-quality-checker',
                      repo_type='space',
                      token=os.environ['HF_TOKEN'],
                      commit_message=f'Deploy image {tag} via CI/CD'
                  )
                  print(f'Deployed {tag}')
                  break
              except Exception as e:
                  if attempt == 7:
                      raise
                  wait = min(120, 15 * 2 ** attempt)
                  print(f'Attempt {attempt + 1} failed. Retrying in {wait}s...')
                  time.sleep(wait)
          "
