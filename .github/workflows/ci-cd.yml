name: ci-cd

on:
  push:

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Lint
        run: ruff check src tests app scripts

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Test
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Pull model from HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os, shutil
          from huggingface_hub import hf_hub_download
          os.makedirs('models', exist_ok=True)
          p = hf_hub_download(
              repo_id='musmanbinyounas/service-quality-checker',
              repo_type='space',
              filename='models/model.joblib',
              token=os.environ['HF_TOKEN']
          )
          shutil.copy(p, 'models/model.joblib')
          print('model bytes:', os.path.getsize('models/model.joblib'))
          "

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/service-quality-checker:${{ github.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/service-quality-checker:latest

  deploy-to-space:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Update Space Dockerfile to pull prebuilt image
        env:
          GITHUB_SHA: ${{ github.sha }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          tag = os.environ['GITHUB_SHA']
          user = os.environ['DH_USER']
          content = f'FROM docker.io/{user}/service-quality-checker:{tag}\n'.encode()
          HfApi().upload_file(
              path_or_fileobj=content,
              path_in_repo='Dockerfile',
              repo_id='musmanbinyounas/service-quality-checker',
              repo_type='space',
              token=os.environ['HF_TOKEN'],
              commit_message=f'Deploy image {tag} via CI/CD'
          )
          "
