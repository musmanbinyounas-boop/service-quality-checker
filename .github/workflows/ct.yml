name: continuous-training

on:
  schedule:
    - cron: "0 3 * * 1"  # Weekly, Monday 03:00 UTC
  workflow_dispatch:

jobs:
  continuous-training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Download raw dataset
        run: python scripts/get_data.py

      - name: Build feature dataset
        run: python -m sqc.features

      - name: Run simulated CT (drift check + retrain)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python -m sqc.retrain --drift-source mongo --force

      - name: Upload CT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ct-artifacts-${{ github.run_id }}
          path: reports/ct/
          if-no-files-found: warn
